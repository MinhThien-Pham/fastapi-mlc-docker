name: mlc-cli Update Check

on:
  schedule:
    - cron: '0 14 * * 1'  # Monday 10am EDT (14:00 UTC)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Read pinned mlc-cli ref
        id: pinned
        run: |
          MLC_CLI_REPO=$(grep '^MLC_CLI_REPO=' docker/mlc-cli.lock | cut -d= -f2-)
          MLC_CLI_REF=$(grep '^MLC_CLI_REF=' docker/mlc-cli.lock | cut -d= -f2-)

          echo "repo=$MLC_CLI_REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$MLC_CLI_REF" >> "$GITHUB_OUTPUT"

          echo "Configured mlc-cli repo: $MLC_CLI_REPO"
          echo "Pinned mlc-cli ref: $MLC_CLI_REF"

      - name: Fetch configured mlc-cli repo HEAD
        id: upstream
        run: |
          SHA=$(git ls-remote "${{ steps.pinned.outputs.repo }}" HEAD | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Configured mlc-cli repo HEAD: $SHA"

      - name: Compare SHAs
        id: compare
        run: |
          if [ "${{ steps.pinned.outputs.sha }}" = "${{ steps.upstream.outputs.sha }}" ]; then
            echo "✅ No update detected. Configured mlc-cli repo HEAD matches the pinned ref."
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "## ✅ No mlc-cli update detected" >> "$GITHUB_STEP_SUMMARY"
            echo "Configured mlc-cli repo HEAD matches pinned ref: \`${{ steps.pinned.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ New mlc-cli commit detected."
            echo "  Pinned ref: ${{ steps.pinned.outputs.sha }}"
            echo "  Repo HEAD:  ${{ steps.upstream.outputs.sha }}"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone configured mlc-cli repo
        if: steps.compare.outputs.drifted == 'true'
        run: git clone --depth 1 "${{ steps.pinned.outputs.repo }}" /tmp/mlc-cli-upstream

      - name: Run contract check
        if: steps.compare.outputs.drifted == 'true'
        id: contract
        run: |
          set +e
          python tests/upstream/check_cli_contract.py /tmp/mlc-cli-upstream
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 1 ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
          else
            echo "status=inconclusive" >> "$GITHUB_OUTPUT"
          fi

      - name: Write summary (contract passed)
        if: steps.compare.outputs.drifted == 'true' && steps.contract.outputs.status == 'pass'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## ✅ New mlc-cli commit detected — contract check PASSED

          | | SHA |
          |--|-----|
          | **Pinned ref** | `${{ steps.pinned.outputs.sha }}` |
          | **Repo HEAD** | `${{ steps.upstream.outputs.sha }}` |

          The CLI interface contract is intact. No automated issue was created.

          **Next step:** Run the local candidate verification flow before updating `docker/mlc-cli.lock`:

          ```bash
          python scripts/verify_mlc_cli_candidate.py
          ```

          Only promote the tested ref after the candidate Docker build, smoke integration test, and full integration test pass.
          EOF

      - name: Write summary (contract failed)
        if: steps.compare.outputs.drifted == 'true' && steps.contract.outputs.status == 'fail'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## ❌ New mlc-cli commit detected — contract check FAILED

          | | SHA |
          |--|-----|
          | **Pinned ref** | `${{ steps.pinned.outputs.sha }}` |
          | **Repo HEAD** | `${{ steps.upstream.outputs.sha }}` |

          The configured mlc-cli repo has changed in ways that may break this API wrapper.
          A GitHub issue has been created.
          EOF

      - name: Write summary (inconclusive)
        if: steps.compare.outputs.drifted == 'true' && steps.contract.outputs.status == 'inconclusive'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## ⚠️ New mlc-cli commit detected — contract check INCONCLUSIVE

          Could not complete the contract check because the source structure changed, parsing failed, or another unexpected condition occurred.

          Check the workflow logs. No issue was created automatically.
          EOF

      - name: Ensure drift label exists
        if: steps.compare.outputs.drifted == 'true' && steps.contract.outputs.status == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "upstream-contract-fail" \
            --color "E11D48" \
            --description "Configured mlc-cli CLI contract check failed" \
            2>/dev/null || true

      - name: Check for existing drift issue
        if: steps.compare.outputs.drifted == 'true' && steps.contract.outputs.status == 'fail'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh issue list --label upstream-contract-fail --state open --json number | jq length)
          echo "open_issues=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Open issue on contract failure
        if: >-
          steps.compare.outputs.drifted == 'true' &&
          steps.contract.outputs.status == 'fail' &&
          steps.existing.outputs.open_issues == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD: ${{ steps.pinned.outputs.sha }}
          NEW: ${{ steps.upstream.outputs.sha }}
          MLC_CLI_REPO: ${{ steps.pinned.outputs.repo }}
        run: |
          WEB_REPO="${MLC_CLI_REPO%.git}"
          WEB_REPO="${WEB_REPO/git@github.com:/https://github.com/}"

          gh issue create \
            --title "❌ mlc-cli contract check failed" \
            --label "upstream-contract-fail" \
            --body "$(cat <<BODY
          The weekly mlc-cli update check detected interface changes that may break this API wrapper.

          | | SHA |
          |--|-----|
          | **Pinned ref** | \`${OLD}\` |
          | **Repo HEAD** | \`${NEW}\` |
          | **Diff** | [compare](${WEB_REPO}/compare/${OLD}...${NEW}) |

          ### What to do

          1. Review the [mlc-cli diff](${WEB_REPO}/compare/${OLD}...${NEW})
          2. Update FastAPI wrapper code if any CLI flags, commands, scripts, or output fields changed
          3. Update \`tests/upstream/check_cli_contract.py\` if the expected CLI surface changed intentionally
          4. Run local candidate verification:

             \`\`\`bash
             python scripts/verify_mlc_cli_candidate.py
             \`\`\`

          5. Only update \`docker/mlc-cli.lock\` after candidate Docker build, smoke integration, and full integration pass
          6. Close this issue after the tested ref is safely promoted
          BODY
          )"

      - name: Fail workflow on contract failure
        if: steps.compare.outputs.drifted == 'true' && steps.contract.outputs.status == 'fail'
        run: exit 1
        